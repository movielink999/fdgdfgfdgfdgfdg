<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .video-container {
            position: relative;
            width: 90%;
            max-width: 900px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin: 20px 0;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            cursor: default;
        }

        /* This class will be added to hide the cursor */
        .cursor-hidden {
            cursor: none !important;
        }

        #videoPlayer {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
        }

        .btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            margin-right: 10px;
            padding: 5px;
            font-size: 16px;
            transition: color 0.2s;
            outline: none;
        }

        .btn:hover {
            color: #00a8ff;
        }

        .time-display {
            margin-left: 10px;
            font-size: 14px;
            color: #ddd;
            min-width: 100px;
        }

        .progress-container {
            flex-grow: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            margin: 0 10px;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #00a8ff;
            border-radius: 4px;
            width: 0;
        }

        .progress-ball {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            left: 0;
            cursor: pointer;
        }

        .volume-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        .volume-slider {
            width: 0;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
            transition: width 0.3s;
            margin-left: 5px;
        }

        .volume-container:hover .volume-slider {
            width: 80px;
        }

        .volume-level {
            height: 100%;
            background-color: #00a8ff;
            width: 100%;
        }

        .right-controls {
            display: flex;
            align-items: center;
        }

        .quality-dropdown,
        .audio-dropdown {
            position: relative;
            margin-left: 10px;
        }

        .dropdown-btn {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 0;
            background-color: rgba(0, 0, 0, 0.9);
            border-radius: 4px;
            min-width: 100px;
            z-index: 1;
        }

        .dropdown-content a {
            color: white;
            padding: 8px 10px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            cursor: pointer;
        }

        .dropdown-content a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .hidden {
            opacity: 0;
        }

        .fullscreen-icon {
            margin-left: 10px;
        }

        /* Make icons from Unicode */
        .control-icon {
            font-size: 18px;
            font-style: normal;
            display: inline-block;
        }

        /* Loading spinner */
        .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #00a8ff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Add scrollable content styles */
        .scrollable-content {
            width: 90%;
            max-width: 900px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* For iOS momentum scrolling */
            margin: 20px 0;
            padding: 20px;
            background: rgba(20, 20, 20, 0.8);
            border-radius: 8px;
            max-height: 300px; /* Set a max height for scrollable content */
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper" id="videoWrapper">
            <video id="videoPlayer" poster="/api/placeholder/900/500" playsinline></video>
            <div class="spinner" id="spinner"></div>
            <div class="video-controls" id="videoControls">
                <div class="control-row">
                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                        <div class="progress-ball" id="progressBall"></div>
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-buttons">
                        <button class="btn" id="playPauseBtn">
                            <span class="control-icon">▶</span>
                        </button>
                        <div class="volume-container">
                            <button class="btn" id="muteBtn">
                                <span class="control-icon">🔊</span>
                            </button>
                            <div class="volume-slider" id="volumeSlider">
                                <div class="volume-level" id="volumeLevel"></div>
                            </div>
                        </div>
                        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                    </div>
                    <div class="right-controls">
                        <div class="audio-dropdown">
                            <button class="dropdown-btn" id="audioBtn">Audio: English</button>
                            <div class="dropdown-content" id="audioDropdown">
                                <a data-audio="0">English</a>
                                <a data-audio="1">Hindi</a>
                                <a data-audio="2">Spanish</a>
                                <a data-audio="3">French</a>
                                <a data-audio="4">German</a>
                            </div>
                        </div>
                        <div class="quality-dropdown">
                            <button class="dropdown-btn" id="qualityBtn">Quality: 720p</button>
                            <div class="dropdown-content" id="qualityDropdown">
                                <a data-quality="1080">1080p</a>
                                <a data-quality="720">720p</a>
                                <a data-quality="480">480p</a>
                                <a data-quality="360">360p</a>
                                <a data-quality="240">240p</a>
                            </div>
                        </div>
                        <button class="btn fullscreen-icon" id="fullscreenBtn">
                            <span class="control-icon">⛶</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.8/hls.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Video player elements
            const videoPlayer = document.getElementById('videoPlayer');
            const videoControls = document.getElementById('videoControls');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const muteBtn = document.getElementById('muteBtn');
            const progressBar = document.getElementById('progressBar');
            const progressBall = document.getElementById('progressBall');
            const progressContainer = document.getElementById('progressContainer');
            const timeDisplay = document.getElementById('timeDisplay');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeLevel = document.getElementById('volumeLevel');
            const qualityBtn = document.getElementById('qualityBtn');
            const qualityDropdown = document.getElementById('qualityDropdown');
            const audioBtn = document.getElementById('audioBtn');
            const audioDropdown = document.getElementById('audioDropdown');
            const spinner = document.getElementById('spinner');
            const videoContainer = document.querySelector('.video-container');
            const videoWrapper = document.getElementById('videoWrapper');
            
            // Video sources - Update with your actual video and audio sources
            const sources = {
                video: {
                    '1080': 'https://s20.nm-cdn.top/files/80216309/1080p/1080p.m3u8?in=cf4b86005405f077adcd87f844ea6360::dd89f3777fe0bd07b1ee530f6a16837f::1741281721::db',
                    '720': 'https://s20.nm-cdn.top/files/80216309/720p/720p.m3u8?in=cf4b86005405f077adcd87f844ea6360::dd89f3777fe0bd07b1ee530f6a16837f::1741281721::db',
                    '480': 'https://s20.nm-cdn.top/files/80216309/480p/480p.m3u8?in=cf4b86005405f077adcd87f844ea6360::dd89f3777fe0bd07b1ee530f6a16837f::1741281721::db',
                    '360': 'https://s20.nm-cdn.top/files/80216309/480p/480p.m3u8?in=cf4b86005405f077adcd87f844ea6360::dd89f3777fe0bd07b1ee530f6a16837f::1741281721::db', // Replace with actual 360p source
                    '240': 'https://s20.nm-cdn.top/files/80216309/480p/480p.m3u8?in=cf4b86005405f077adcd87f844ea6360::dd89f3777fe0bd07b1ee530f6a16837f::1741281721::db'  // Replace with actual 240p source
                },
                audio: {
                    '0': 'https://s20.nm-cdn.top/files/80216309/a/0/0.m3u8', // English
                    '1': 'https://s20.nm-cdn.top/files/80216309/a/1/1.m3u8', // Hindi
                    '2': 'https://s20.nm-cdn.top/files/80216309/a/0/0.m3u8', // Spanish - Replace with actual source
                    '3': 'https://s20.nm-cdn.top/files/80216309/a/0/0.m3u8', // French - Replace with actual source
                    '4': 'https://s20.nm-cdn.top/files/80216309/a/0/0.m3u8'  // German - Replace with actual source
                }
            };
            
            // Current settings
            let currentQuality = '720';
            let currentAudio = '0';
            let lastVolumeLevel = 1;
            let controlsTimeout;
            let cursorTimeout;
            let audioPlayer = null;
            let hls = null;
            let hlsAudio = null;
            let isMobile = false;
            let syncInterval = null;
            
            // Check if device is mobile
            function checkMobile() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }
            
            // Initialize mobile detection
            isMobile = checkMobile();
            
            // Set appropriate quality for mobile devices
            if (isMobile) {
                if (window.navigator.connection) {
                    // Use Network Information API if available
                    if (window.navigator.connection.type === 'cellular' || 
                        window.navigator.connection.downlink < 1) {
                        currentQuality = '360';
                    } else {
                        currentQuality = '480';
                    }
                } else {
                    // Default fallback for mobile
                    currentQuality = '480';
                }
                qualityBtn.textContent = `Quality: ${currentQuality}p`;
            }
            
            // Function to synchronize audio and video
            function syncAudioWithVideo() {
                if (audioPlayer && !videoPlayer.paused) {
                    const syncThreshold = 0.3; // 300ms threshold
                    if (Math.abs(audioPlayer.currentTime - videoPlayer.currentTime) > syncThreshold) {
                        audioPlayer.currentTime = videoPlayer.currentTime;
                    }
                }
            }
            
            // Check if HLS is supported
            function initializeVideo() {
                if (Hls.isSupported()) {
                    const hlsConfig = {
                        maxBufferLength: 60,
                        maxMaxBufferLength: 120,
                        fragLoadingTimeOut: 20000,
                        manifestLoadingTimeOut: 20000,
                        levelLoadingTimeOut: 20000
                    };
                    
                    hls = new Hls(hlsConfig);
                    hls.loadSource(sources.video[currentQuality]);
                    hls.attachMedia(videoPlayer);
                    
                    // Load audio separately
                    initializeAudio();
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        hideSpinner();
                    });
                    
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.log('HLS video error:', data);
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    // Try to recover network error
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    // Cannot recover
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    // Native HLS support (Safari)
                    videoPlayer.src = sources.video[currentQuality];
                } else {
                    alert('HLS is not supported in your browser');
                }
            }
            
            // Initialize audio
            function initializeAudio() {
                // Create an audio element for separate audio track
                if (!audioPlayer) {
                    audioPlayer = new Audio();
                    document.body.appendChild(audioPlayer);
                    audioPlayer.style.display = 'none';
                }
                
                if (Hls.isSupported()) {
                    const hlsConfig = {
                        maxBufferLength: 60,
                        maxMaxBufferLength: 120,
                        fragLoadingTimeOut: 20000,
                        manifestLoadingTimeOut: 20000,
                        levelLoadingTimeOut: 20000
                    };
                    
                    if (hlsAudio) {
                        hlsAudio.destroy();
                    }
                    
                    hlsAudio = new Hls(hlsConfig);
                    hlsAudio.loadSource(sources.audio[currentAudio]);
                    hlsAudio.attachMedia(audioPlayer);
                    
                    hlsAudio.on(Hls.Events.MANIFEST_PARSED, function() {
                        // Sync audio with video
                        videoPlayer.addEventListener('play', function() {
                            audioPlayer.play();
                        });
                        
                        videoPlayer.addEventListener('pause', function() {
                            audioPlayer.pause();
                        });
                        
                        videoPlayer.addEventListener('seeking', function() {
                            audioPlayer.currentTime = videoPlayer.currentTime;
                        });
                    });
                    
                    hlsAudio.on(Hls.Events.ERROR, function(event, data) {
                        console.log('HLS audio error:', data);
                        if (data.fatal) {
                            if (currentAudio !== '0') {
                                console.error('Audio track error. Falling back to English.');
                                changeAudio('0');
                            }
                        }
                    });
                    
                    // Clear existing interval if any
                    if (syncInterval) {
                        clearInterval(syncInterval);
                    }
                    
                    // Setup periodic sync (every 2 seconds)
                    syncInterval = setInterval(syncAudioWithVideo, 2000);
                }
            }
            
            // Change video quality
            function changeQuality(quality) {
                showSpinner();
                const currentTime = videoPlayer.currentTime;
                const isPaused = videoPlayer.paused;
                
                currentQuality = quality;
                qualityBtn.textContent = `Quality: ${quality}p`;
                
                if (hls) {
                    hls.loadSource(sources.video[quality]);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        videoPlayer.currentTime = currentTime;
                        // Ensure audio is properly synced after quality change
                        if (audioPlayer) {
                            audioPlayer.currentTime = currentTime;
                        }
                        
                        if (!isPaused) {
                            // Use Promise.all to ensure both start together
                            Promise.all([
                                videoPlayer.play().catch(e => console.error('Video play error:', e)),
                                audioPlayer ? audioPlayer.play().catch(e => console.error('Audio play error:', e)) : Promise.resolve()
                            ]).then(() => {
                                hideSpinner();
                            }).catch(() => {
                                hideSpinner();
                            });
                        } else {
                            hideSpinner();
                        }
                    });
                } else {
                    videoPlayer.src = sources.video[quality];
                    videoPlayer.currentTime = currentTime;
                    if (!isPaused) {
                        videoPlayer.play().catch(e => console.error('Play error:', e));
                    }
                    hideSpinner();
                }
            }
            
            // Change audio track
            function changeAudio(audioTrack) {
                const currentTime = videoPlayer.currentTime;
                currentAudio = audioTrack;
                
                // Map audio track numbers to language names
                const audioLanguages = {
                    '0': 'English',
                    '1': 'Hindi',
                    '2': 'Spanish',
                    '3': 'French',
                    '4': 'German'
                };
                
                audioBtn.textContent = `Audio: ${audioLanguages[audioTrack]}`;
                
                if (hlsAudio && audioPlayer) {
                    showSpinner();
                    hlsAudio.loadSource(sources.audio[audioTrack]);
                    
                    hlsAudio.on(Hls.Events.MANIFEST_PARSED, function() {
                        audioPlayer.currentTime = currentTime;
                        if (!videoPlayer.paused) {
                            audioPlayer.play().catch(e => console.error('Audio play error:', e));
                        }
                        hideSpinner();
                    });
                }
            }
            
            // Format time in seconds to MM:SS
            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                seconds = Math.floor(seconds % 60);
                return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }
            
            // Show loading spinner
            function showSpinner() {
                spinner.style.display = 'block';
            }
            
            // Hide loading spinner
            function hideSpinner() {
                spinner.style.display = 'none';
            }
            
            // Update progress bar
            function updateProgress() {
                if (videoPlayer.duration) {
                    const percent = (videoPlayer.currentTime / videoPlayer.duration) * 100;
                    progressBar.style.width = `${percent}%`;
                    progressBall.style.left = `${percent}%`;
                    timeDisplay.textContent = `${formatTime(videoPlayer.currentTime)} / ${formatTime(videoPlayer.duration)}`;
                }
            }
            
            // Set progress bar position on click
            function setProgress(e) {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                videoPlayer.currentTime = pos * videoPlayer.duration;
                if (audioPlayer) {
                    audioPlayer.currentTime = videoPlayer.currentTime;
                }
            }
            
            // Show controls
            function showControls() {
                videoControls.classList.remove('hidden');
                clearTimeout(controlsTimeout);
            }
            
            // Hide controls after delay
            function hideControlsWithDelay() {
                clearTimeout(controlsTimeout);
                controlsTimeout = setTimeout(() => {
                    videoControls.classList.add('hidden');
                }, 3000);
            }
            
            // Show cursor
            function showCursor() {
                videoWrapper.classList.remove('cursor-hidden');
                clearTimeout(cursorTimeout);
            }
            
            // Hide cursor after delay
            function hideCursorWithDelay() {
                clearTimeout(cursorTimeout);
                cursorTimeout = setTimeout(() => {
                    videoWrapper.classList.add('cursor-hidden');
                }, 3000);
            }
            
            // Toggle play/pause
            function togglePlay() {
                if (videoPlayer.paused) {
                    videoPlayer.play();
                    if (audioPlayer) {
                        audioPlayer.play();
                    }
                    playPauseBtn.innerHTML = '<span class="control-icon">⏸</span>';
                } else {
                    videoPlayer.pause();
                    if (audioPlayer) {
                        audioPlayer.pause();
                    }
                    playPauseBtn.innerHTML = '<span class="control-icon">▶</span>';
                }
            }
            
            // Toggle mute
            function toggleMute() {
                if (videoPlayer.muted) {
                    videoPlayer.muted = false;
                    if (audioPlayer) {
                        audioPlayer.muted = false;
                    }
                    muteBtn.innerHTML = '<span class="control-icon">🔊</span>';
                    volumeLevel.style.width = `${lastVolumeLevel * 100}%`;
                } else {
                    videoPlayer.muted = true;
                    if (audioPlayer) {
                        audioPlayer.muted = true;
                    }
                    muteBtn.innerHTML = '<span class="control-icon">🔇</span>';
                    volumeLevel.style.width = '0';
                }
            }
            
            // Set volume
            function setVolume(e) {
                const rect = volumeSlider.getBoundingClientRect();
                let volume = (e.clientX - rect.left) / rect.width;
                
                // Clamp volume between 0 and 1
                volume = Math.max(0, Math.min(1, volume));
                
                videoPlayer.volume = volume;
                if (audioPlayer) {
                    audioPlayer.volume = volume;
                }
                lastVolumeLevel = volume;
                
                volumeLevel.style.width = `${volume * 100}%`;
                
                if (volume === 0) {
                    muteBtn.innerHTML = '<span class="control-icon">🔇</span>';
                } else {
                    muteBtn.innerHTML = '<span class="control-icon">🔊</span>';
                }
            }
            
            // Toggle fullscreen
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    videoContainer.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            }
            
            // Event listeners
            playPauseBtn.addEventListener('click', togglePlay);
            videoPlayer.addEventListener('click', togglePlay);
            
            muteBtn.addEventListener('click', toggleMute);
            
            volumeSlider.addEventListener('click', setVolume);
            volumeSlider.addEventListener('mousemove', function(e) {
                if (e.buttons === 1) {  // Only if mouse button is pressed
                    setVolume(e);
                }
            });
            
            progressContainer.addEventListener('click', setProgress);
            progressContainer.addEventListener('mousemove', function(e) {
                if (e.buttons === 1) {  // Only if mouse button is pressed
                    setProgress(e);
                }
            });
            
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            videoPlayer.addEventListener('timeupdate', updateProgress);
            
            videoPlayer.addEventListener('loadedmetadata', function() {
                timeDisplay.textContent = `0:00 / ${formatTime(videoPlayer.duration)}`;
            });
            
            // Quality dropdown
            qualityBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                qualityDropdown.style.display = qualityDropdown.style.display === 'block' ? 'none' : 'block';
                audioDropdown.style.display = 'none';  // Hide other dropdown
            });
            
            document.querySelectorAll('#qualityDropdown a').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    changeQuality(this.getAttribute('data-quality'));
                    qualityDropdown.style.display = 'none';
                });
            });
            
            // Audio dropdown
            audioBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                audioDropdown.style.display = audioDropdown.style.display === 'block' ? 'none' : 'block';
                qualityDropdown.style.display = 'none';  // Hide other dropdown
            });
            
            document.querySelectorAll('#audioDropdown a').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.stopPropagation();
                    changeAudio(this.getAttribute('data-audio'));
                    audioDropdown.style.display = 'none';
                });
            });
            
            // Controls and cursor visibility management
            videoContainer.addEventListener('touchstart', function() {
                showControls();
                showCursor();
                hideControlsWithDelay();
                hideCursorWithDelay();
            });
            
            videoContainer.addEventListener('touchmove', function() {
                showControls();
                showCursor();
                hideControlsWithDelay();
                hideCursorWithDelay();
            });
            
            videoContainer.addEventListener('mousemove', function() {
                showControls();
                showCursor();
                hideControlsWithDelay();
                hideCursorWithDelay();
            });
            
            videoContainer.addEventListener('mouseleave', function() {
                videoControls.classList.add('hidden');
                videoWrapper.classList.add('cursor-hidden');
            });
            
            // Close dropdowns when clicking outside
            document.addEventListener('click', function(e) {
                qualityDropdown.style.display = 'none';
                audioDropdown.style.display = 'none';
            });
            
            // Show loading spinner initially
            showSpinner();
            
            // Start with controls visible then hide after delay
            showControls();
            hideControlsWithDelay();
            
            // Start with cursor visible then hide after delay
            showCursor();
            hideCursorWithDelay();
            
            // Preload audio element to reduce initial sync issues
            document.addEventListener('DOMContentLoaded', function() {
                // Set a small initial buffering for audio to reduce startup lag
                if (audioPlayer) {
                    audioPlayer.preload = 'auto';
                }
            });
            
            // Initialize video and audio synchronization
            initializeVideo();
            
            // Add event for when playback stalls
            videoPlayer.addEventListener('stalled', function() {
                showSpinner();
            });
            
            videoPlayer.addEventListener('waiting', function() {
                showSpinner();
            });
            
            videoPlayer.addEventListener('playing', function() {
                hideSpinner();
            });
            
            // Monitoring sync events
            videoPlayer.addEventListener('seeked', function() {
                // Force sync after seeking completes
                if (audioPlayer) {
                    audioPlayer.currentTime = videoPlayer.currentTime;
                }
            });
            
            // Add responsive behavior for better mobile experience
            window.addEventListener('resize', function() {
                // Adjust quality based on screen size
                if (window.innerWidth <= 768 && currentQuality === '1080') {
                    changeQuality('720');
                } else if (window.innerWidth <= 480 && currentQuality === '720') {
                    changeQuality('480');
                }
            });
            
            // Clean up resources when page unloads
            window.addEventListener('beforeunload', function() {
                if (hls) {
                    hls.destroy();
                }
                if (hlsAudio) {
                    hlsAudio.destroy();
                }
                if (syncInterval) {
                    clearInterval(syncInterval);
                }
            });
        });
    </script>
